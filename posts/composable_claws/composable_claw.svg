<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Composable claw architecture</title>
  <desc id="diagram-description">A frontend connects to a harness over ACP. The harness connects to a model, to MCP tools through MCP servers, and directly to CLI tools.</desc>

  <defs>
    <marker id="arrow-acp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-mcp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-cli" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    <marker id="arrow-model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
    </marker>
  </defs>

  <rect width="800" height="400" rx="12" fill="#ffffff" />
  <text x="40" y="38" fill="#000000" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="700">Composable Claw Stack</text>

  <!-- Protocol connections -->
  <path d="M 220 205 H 280" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-acp)" />
  <path d="M 530 170 L 620 85" fill="none" stroke="#000000" stroke-width="4" marker-end="url(#arrow-model)" />
  <path d="M 530 205 H 620" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow-mcp)" />
  <path d="M 530 240 L 620 325" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow-cli)" />

  <!-- Protocol labels -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <rect x="226" y="181" width="48" height="28" rx="14" fill="#dbeafe" />
    <text x="250" y="200" fill="#1d4ed8">ACP</text>

    <rect x="546" y="181" width="58" height="28" rx="14" fill="#dcfce7" />
    <text x="575" y="200" fill="#15803d">MCP</text>

    <rect x="549" y="291" width="52" height="28" rx="14" fill="#f1f5f9" />
    <text x="575" y="310" fill="#475569">CLI</text>
  </g>

  <!-- Components -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <rect x="40" y="160" width="180" height="90" rx="12" fill="#ffffff" stroke="#000000" stroke-width="3" />
    <text x="130" y="200" fill="#000000" font-size="19" font-weight="700">Frontend</text>
    <text x="130" y="226" fill="#1d4ed8" font-size="15">ACP client</text>

    <rect x="280" y="130" width="250" height="150" rx="12" fill="#ffffff" stroke="#000000" stroke-width="3" />
    <text x="405" y="188" fill="#000000" font-size="19" font-weight="700">Harness</text>
    <text x="405" y="215" font-size="15"><tspan fill="#1d4ed8">ACP server</tspan><tspan fill="#000000"> · </tspan><tspan fill="#15803d">MCP client</tspan></text>

    <rect x="620" y="40" width="140" height="90" rx="12" fill="#ffffff" stroke="#000000" stroke-width="3" />
    <text x="690" y="91" fill="#000000" font-size="19" font-weight="700">Model</text>

    <rect x="620" y="160" width="140" height="90" rx="12" fill="#ffffff" stroke="#000000" stroke-width="3" />
    <text x="690" y="201" fill="#000000" font-size="18" font-weight="700">MCP Tools</text>
    <text x="690" y="226" fill="#15803d" font-size="14">MCP servers</text>

    <rect x="620" y="280" width="140" height="90" rx="12" fill="#ffffff" stroke="#000000" stroke-width="3" />
    <text x="690" y="321" fill="#000000" font-size="18" font-weight="700">CLI Tools</text>
    <text x="690" y="346" fill="#475569" font-size="14">CLI commands</text>
  </g>
</svg>
